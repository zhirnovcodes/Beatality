<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Beatality</title>
    </head>
    <body>
        <div class="page">
            <div class="page-sources">
                <button id="preview" type="button" disabled>Play</button>
            </div>
            <div id="app"></div>
            <fieldset id="output-controls">
                <legend>Output</legend>
                <label>Volume <input id="output-volume" type="range" min="0" max="1.2" step="0.001" value="1" /></label>
                <label>Pan <input id="output-pan" type="range" min="-1" max="1" step="0.001" value="0" /></label>
            </fieldset>
            <fieldset id="track-controls" disabled>
                <legend>Sample</legend>
                <label>Volume <input id="track-volume" type="range" min="0" max="1.2" step="0.001" value="1" /></label>
                <label>Pan <input id="track-pan" type="range" min="-1" max="1" step="0.001" value="0" /></label>
                <label class="start">
                    Start
                    <input id="track-start" type="range" min="0" max="1" step="0.001" value="0" aria-label="Start" />
                    <input id="track-start-sec" type="number" min="0" step="any" value="0" aria-label="Start in seconds" />
                    s
                </label>
                <label>Length <input id="track-length" type="range" min="0" max="1" step="0.001" value="1" /></label>
                <label>Loop <input id="track-loop-toggle" type="checkbox" /></label>
            </fieldset>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
