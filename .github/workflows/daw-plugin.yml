name: DAW plugin

# Builds the IvanDAW web plugin (apps/web-widget/dist-daw/) and, on master, publishes it as
# beatality-daw.zip in a daw-build-<run number> release. IvanDAW downloads a pinned release.
# The zip's root is the content of dist-daw/, so index.js sits at the top level.
on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          # The version the local wasm build uses.
          version: 6.0.12
          actions-cache-folder: emsdk-cache

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build wasm
        run: |
          emcmake cmake -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm --target beatality

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build DAW plugin
        run: pnpm --filter @beatality/web-widget build:daw

      - name: Zip
        working-directory: apps/web-widget/dist-daw
        run: |
          test -f index.js && test -f processor.js && test -f beatality.wasm && test -f manifest.json
          zip -r "$GITHUB_WORKSPACE/beatality-daw.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: beatality-daw
          path: beatality-daw.zip

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daw-build-${{ github.run_number }}
          name: DAW build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: beatality-daw.zip
          body: |
            IvanDAW web plugin, built from ${{ github.sha }}.
            Unzip as the plugin folder: index.js is at the top level.
