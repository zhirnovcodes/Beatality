<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Beatality</title>
<link rel="stylesheet" href="/ui/skin/skin.css">
<style>
  html, body { margin: 0; width: 496px; height: 800px; overflow: hidden; background: #2a2c30; }
  #error {
    height: 21px; margin: 0; padding: 0 8px;
    color: #ff8d8d; font: 12px/21px system-ui, sans-serif;
    text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .beatality-skin .sample-grid .row > .spectrum { overflow: hidden; }
  .beatality-skin .sample-grid .row > .spectrum canvas {
    position: absolute; left: 0; top: 0; width: 424px; height: 28px; pointer-events: none;
  }
</style>
</head>
<body>
<div class="beatality-skin">
  <section class="part top" aria-label="Main controls">
    <div class="window"></div>
    <div class="content">
      <div class="bpm-caption" aria-hidden="true"></div>
      <div class="bpm-lcd" aria-hidden="true"></div>
      <div class="bpm-field">
        <input type="text" id="bpm" value="120" inputmode="numeric" maxlength="3" spellcheck="false" autocomplete="off" aria-label="BPM">
      </div>
      <button type="button" class="bpm-btn plus" aria-label="BPM up">+</button>
      <button type="button" class="bpm-btn minus" aria-label="BPM down">-</button>
      <!-- On, the engine plays the host's tempo and the digits read 5YN. -->
      <button type="button" class="bpm-sync" id="bpm-sync" aria-pressed="false" aria-label="Sync">SYNC</button>

      <span class="mix-caption volume">VOLUME</span>
      <div class="mix-slider volume"><div class="track"></div><div class="snap"></div><div class="thumb"></div>
        <input type="range" id="master-volume" min="0" max="1.2" step="0.01" value="1" data-snap="1" aria-label="Volume"></div>
      <span class="mix-caption pan">PAN</span>
      <!-- Each slice's pan roll is scaled onto MIN..MAX. -->
      <div class="mix-range pan" id="master-pan">
        <div class="track lit"></div><div class="track dark"></div><div class="snap"></div><div class="pin min"></div><div class="pin max"></div>
        <input type="range" class="min" id="master-pan-min" min="-1" max="1" step="0.01" value="0" aria-label="Pan minimum">
        <input type="range" class="max" id="master-pan-max" min="-1" max="1" step="0.01" value="0" aria-label="Pan maximum">
      </div>

      <div class="seek" role="meter" aria-label="Playhead position" aria-valuemin="0" aria-valuemax="1">
        <div class="band"></div><div class="head"></div>
        <input type="range" id="playhead" min="0" max="1" step="0.001" value="0" disabled tabindex="-1" aria-label="Playhead position">
      </div>

      <div class="slider-captions" aria-hidden="true">
        <span data-for="loop">LOOP: <b class="value">8</b></span>
        <span data-for="slice">SLICES: <b class="value">1</b></span>
        <span data-for="attack">ATTACK: <b class="value">2</b> <i class="unit">MS</i></span>
      </div>
      <div class="slider loop">
        <div class="track"></div><div class="ticks dim"></div><div class="ticks lit"></div><div class="thumb"></div>
        <input type="range" id="loop" min="1" max="32" step="1" value="8" aria-label="Loop">
      </div>
      <div class="slider slice">
        <div class="track"></div><div class="ticks dim"></div><div class="ticks lit"></div><div class="thumb"></div>
        <input type="range" id="slice" min="-4" max="4" step="1" value="0" aria-label="Slices">
      </div>
      <div class="slider attack">
        <div class="track"></div><div class="ticks dim"></div><div class="ticks lit"></div><div class="thumb"></div>
        <input type="range" id="attack" min="2" max="16" step="1" value="2" aria-label="Attack (ms)">
      </div>
    </div>
    <div class="case"></div>
    <div class="controls">
      <button type="button" class="randomize" id="randomize">Randomize</button>
    </div>
  </section>
  <section class="part effects" aria-label="Effects">
    <div class="window"></div>
    <div class="content">
      <button type="button" class="fx-btn fx-enable" id="fx-enable" aria-pressed="true">EFFECTS ON</button>
      <button type="button" class="fx-btn fx-shuffle" id="fx-shuffle">SHUFFLE</button>
      <div class="fx-caps" aria-hidden="true">
        <div class="fx-cap" style="left: 31px; width: 44px"><span class="name">GLOBAL</span><span class="sub" style="left: 13px">PWR</span><span class="sub" style="left: 31px">%</span></div>
        <div class="fx-cap" style="left: 79px; width: 26px"><span class="clock"></span></div>
        <div class="fx-cap" style="left: 132px; width: 44px"><span class="name">DELAY</span><span class="sub" style="left: 13px">PWR</span><span class="sub" style="left: 31px">%</span></div>
        <div class="fx-cap" style="left: 180px; width: 44px"><span class="name">REVERB</span><span class="sub" style="left: 13px">PWR</span><span class="sub" style="left: 31px">%</span></div>
        <div class="fx-cap" style="left: 228px; width: 44px"><span class="name">REVERSE</span><span class="sub" style="left: 13px">PWR</span><span class="sub" style="left: 31px">%</span></div>
        <div class="fx-cap" style="left: 276px; width: 44px"><span class="name">FILTER</span><span class="sub" style="left: 13px">PWR</span><span class="sub" style="left: 31px">%</span></div>
        <div class="fx-cap" style="left: 324px; width: 44px"><span class="name">FLANGER</span><span class="sub" style="left: 13px">PWR</span><span class="sub" style="left: 31px">%</span></div>
        <div class="fx-cap" style="left: 372px; width: 44px"><span class="name">TRANCE</span><span class="sub" style="left: 13px">PWR</span><span class="sub" style="left: 31px">%</span></div>
        <div class="fx-cap" style="left: 420px; width: 44px"><span class="name">SHIFT</span><span class="sub" style="left: 13px">PWR</span><span class="sub" style="left: 31px">%</span></div>
      </div>
      <div class="fx-sliders">
        <div class="fx-slider" style="left: 32px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-power" min="0" max="1" step="0.01" value="1" aria-label="Global power"></div>
        <div class="fx-slider" style="left: 50px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-chance" min="0" max="1" step="0.01" value="0" aria-label="Global chance (%)"></div>
        <div class="fx-slider time" style="left: 80px"><div class="track"></div><div class="fill"></div><div class="thumb max"></div><div class="thumb min"></div>
          <input type="range" class="min" id="fx-time-min" min="-4" max="1" step="1" value="-3" aria-label="Effect time minimum" aria-valuetext="1/8 beat">
          <input type="range" class="max" id="fx-time-max" min="-4" max="1" step="1" value="-1" aria-label="Effect time maximum" aria-valuetext="1/2 beat"></div>
        <div class="fx-slider" style="left: 133px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-delay-power" min="0" max="1" step="0.01" value="1" aria-label="Delay power"></div>
        <div class="fx-slider" style="left: 151px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-delay-chance" min="0" max="1" step="0.01" value="0" aria-label="Delay chance (%)"></div>
        <div class="fx-slider" style="left: 181px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-reverb-power" min="0" max="1" step="0.01" value="1" aria-label="Reverb power"></div>
        <div class="fx-slider" style="left: 199px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-reverb-chance" min="0" max="1" step="0.01" value="0" aria-label="Reverb chance (%)"></div>
        <div class="fx-slider" style="left: 229px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-reverse-power" min="0" max="1" step="0.01" value="1" aria-label="Reverse power"></div>
        <div class="fx-slider" style="left: 247px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-reverse-chance" min="0" max="1" step="0.01" value="0" aria-label="Reverse chance (%)"></div>
        <div class="fx-slider" style="left: 277px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-filter-power" min="0" max="1" step="0.01" value="1" aria-label="Filter power"></div>
        <div class="fx-slider" style="left: 295px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-filter-chance" min="0" max="1" step="0.01" value="0" aria-label="Filter chance (%)"></div>
        <div class="fx-slider" style="left: 325px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-flanger-power" min="0" max="1" step="0.01" value="1" aria-label="Flanger power"></div>
        <div class="fx-slider" style="left: 343px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-flanger-chance" min="0" max="1" step="0.01" value="0" aria-label="Flanger chance (%)"></div>
        <div class="fx-slider" style="left: 373px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-trance-power" min="0" max="1" step="0.01" value="1" aria-label="Trance power"></div>
        <div class="fx-slider" style="left: 391px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-trance-chance" min="0" max="1" step="0.01" value="0" aria-label="Trance chance (%)"></div>
        <div class="fx-slider" style="left: 421px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-shift-power" min="0" max="1" step="0.01" value="1" aria-label="Shift power"></div>
        <div class="fx-slider" style="left: 439px"><div class="track"></div><div class="fill"></div><div class="thumb"></div>
          <input type="range" id="fx-shift-chance" min="0" max="1" step="0.01" value="0" aria-label="Shift chance (%)"></div>
        <ol class="fx-scale" aria-hidden="true" style="left: 102px"><li>2</li><li>1</li><li>1/2</li><li>1/4</li><li>1/8</li><li>1/16</li></ol>
      </div>
    </div>
    <div class="case"></div>
  </section>
  <section class="part beatrepeat" aria-label="Beat repeat">
    <div class="window"></div>
    <div class="content">
      <!-- ON | LOOP PARTS 8 numbered buttons (place and images from skin.css) | SIZE (min / max, 1/32 .. 2, index 0..6) over MIX (0..1) | LENGTH (1/16 .. 2, index 0..5) over CHANCE (0..1) -->
      <button type="button" class="br-power" id="br-power" aria-pressed="false" aria-label="Beat repeat on">ON</button>
      <div class="br-parts" role="group" aria-label="Loop parts">
        <input type="checkbox" class="br-part" id="br-pos-1" aria-label="Loop part 1">
        <input type="checkbox" class="br-part" id="br-pos-2" aria-label="Loop part 2">
        <input type="checkbox" class="br-part" id="br-pos-3" aria-label="Loop part 3">
        <input type="checkbox" class="br-part" id="br-pos-4" aria-label="Loop part 4">
        <input type="checkbox" class="br-part" id="br-pos-5" aria-label="Loop part 5">
        <input type="checkbox" class="br-part" id="br-pos-6" aria-label="Loop part 6">
        <input type="checkbox" class="br-part" id="br-pos-7" aria-label="Loop part 7">
        <input type="checkbox" class="br-part" id="br-pos-8" aria-label="Loop part 8">
      </div>

      <span class="br-name size">SIZE</span>
      <div class="br-scale" aria-hidden="true"></div>
      <div class="br-range" id="br-size">
        <div class="track lit"></div><div class="track dark"></div><div class="pin min"></div><div class="pin max"></div>
        <input type="range" class="min" id="br-size-min" min="0" max="6" step="1" value="5" aria-label="Size minimum">
        <input type="range" class="max" id="br-size-max" min="0" max="6" step="1" value="5" aria-label="Size maximum">
      </div>
      <span class="br-name mix">MIX</span>
      <div class="br-slider long mix"><div class="track"></div><div class="thumb"></div>
        <input type="range" id="br-mix" min="0" max="1" step="0.01" value="1" aria-label="Mix"></div>

      <span class="br-name length">LENGTH</span>
      <output class="br-value length" id="br-length-value" for="br-length" aria-hidden="true" data-i="4">1</output>
      <div class="br-slider short length"><div class="track"></div><div class="thumb"></div>
        <input type="range" id="br-length" min="0" max="5" step="1" value="4" aria-label="Length"></div>
      <span class="br-name chance">CHANCE</span>
      <div class="br-slider short chance"><div class="track"></div><div class="thumb"></div>
        <input type="range" id="br-chance" min="0" max="1" step="0.01" value="0" aria-label="Chance"></div>
    </div>
    <div class="case"></div>
  </section>
  <section class="part bottom" aria-label="Samples">
    <div class="window"></div>
    <div class="content">
      <div class="viewport" id="sample-viewport" tabindex="0">
        <div class="scroll-content">
          <div class="sample-grid" id="sample-grid" role="listbox" aria-label="Samples"></div>
          <div class="bank-view" id="bank-view">
            <div class="header">SELECT BANK</div>
            <ol class="bank-list" id="bank-list" role="listbox" aria-label="Banks"></ol>
          </div>
        </div>
      </div>
    </div>
    <div class="case"></div>
    <div class="controls">
      <div class="scrollbar" role="scrollbar" aria-controls="sample-viewport" aria-orientation="vertical">
        <div class="thumb"></div>
      </div>
      <button type="button" class="scroll-arrow up" aria-label="Scroll up"></button>
      <button type="button" class="scroll-arrow down" aria-label="Scroll down"></button>
      <button type="button" class="round-btn append" id="append">Add</button>
      <button type="button" class="round-btn remove" id="remove" disabled>Remove</button>
      <button type="button" class="round-btn clear" id="clear" disabled>Clear</button>
      <button type="button" class="round-btn load" id="load-bank">Load</button>
      <button type="button" class="round-btn save" id="save">Save</button>
      <div class="bank-panel" id="bank-panel">
        <button type="button" class="bank-btn" id="bank-select">SELECT</button>
        <button type="button" class="bank-btn" id="bank-load-file">LOAD FILE</button>
        <button type="button" class="bank-btn close" id="bank-close" aria-label="Close">X</button>
      </div>
      <!-- selected sample's file name, right of the buttons (the bank picker buttons take its place) -->
      <div class="track-name" id="track-name" title=""></div>

      <!-- selected sample's controls, on the dark screen under the buttons.
           VOL / PAN | ST. (start) / LEN. (length) | start time (s) / LOOP | BPM | WARP (none, beat, pitch) | BEAT (1/32 .. 2) -->
      <fieldset class="sample-panel" id="selected-sample" disabled>
        <span class="name vol">VOL</span>
        <div class="slider vol"><div class="track"></div><div class="snap"></div><div class="thumb"></div>
          <input type="range" id="volume" min="0" max="1.2" step="0.01" value="1" aria-label="Volume" data-snap="1"></div>
        <span class="name pan">PAN</span>
        <div class="slider pan"><div class="track"></div><div class="snap"></div><div class="thumb"></div>
          <input type="range" id="pan" min="-1" max="1" step="0.01" value="0" aria-label="Pan" data-snap="0"></div>

        <span class="name start">ST.</span>
        <div class="slider start"><div class="track"></div><div class="thumb"></div>
          <input type="range" id="start" min="0" max="1" step="0.001" value="0" aria-label="Start"></div>
        <span class="name length">LEN.</span>
        <div class="slider length"><div class="track"></div><div class="thumb"></div>
          <input type="range" id="length" min="0" max="1" step="0.001" value="1" aria-label="Length"></div>

        <input type="text" class="field time" id="start-time" value="0.00" inputmode="decimal" spellcheck="false" aria-label="Start (seconds)" data-max="0">
        <span class="name loop">LOOP</span>
        <input type="checkbox" class="toggle" id="track-loop" aria-label="Loop">

        <span class="name bpm">BPM</span>
        <input type="text" class="field bpm" id="track-bpm" value="120.0" inputmode="decimal" spellcheck="false" aria-label="Sample BPM">

        <span class="name warp">WARP</span>
        <button type="button" class="warp-btn prev" id="warp-prev" aria-label="Previous warp mode"></button>
        <output class="warp-value" id="track-warp" data-value="none" aria-label="Warp">NONE</output>
        <button type="button" class="warp-btn next" id="warp-next" aria-label="Next warp mode"></button>

        <span class="name beat">BEAT <b class="value"></b></span>
        <div class="slider beat"><div class="track"></div><div class="thumb"></div>
          <input type="range" id="track-beat" min="0" max="6" step="1" value="0" aria-label="Beat"></div>
      </fieldset>
    </div>
  </section>
</div>
<p id="error"></p>
<script src="/plugin.js"></script>
</body>
</html>
